<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Auth System</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h1>Create Account</h1>
        <p class="subtitle">Sign up to access your profile dashboard.</p>

        <form id="registerForm" enctype="multipart/form-data">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required minlength="2" />
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required minlength="6" />
          </div>

          <div class="field">
            <label for="profilePicture">Profile Picture</label>
            <input id="profilePicture" name="profilePicture" type="file" accept="image/*" />
          </div>

          <div id="message" class="message"></div>
          <button id="submitBtn" type="submit">Register</button>
        </form>

        <div class="link-row">
          Already have an account? <a href="./login.html">Login</a>
        </div>
      </section>
    </main>

    <script src="./js/api.js"></script>
    <script src="./js/register.js"></script>
  </body>
</html>
